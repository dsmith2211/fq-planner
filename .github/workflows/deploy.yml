name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/pdfs/**"
      - "pipeline/**"
      - "*.html"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Extract PDFs → data/extracted/
        run: python pipeline/extract_pdfs.py

      - name: Generate browse.html
        run: python pipeline/generate_browse.py --out browse.html

      - name: Commit generated files back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/extracted/ browse.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "build: update extracted JSON + browse.html [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
