function Badge({ text, color }) {
  const colors = {
    green: "bg-green-100 text-green-800",
    blue: "bg-blue-100 text-blue-800",
    red: "bg-red-100 text-red-800",
    yellow: "bg-yellow-100 text-yellow-800",
    purple: "bg-purple-100 text-purple-800",
    gray: "bg-gray-100 text-gray-700",
    indigo: "bg-indigo-100 text-indigo-800",
  };
  return (
    <span className={`inline-block text-xs font-semibold px-2 py-0.5 rounded-full mr-1 mb-1 ${colors[color] || colors.gray}`}>
      {text}
    </span>
  );
}

function Card({ children, className = "" }) {
  return <div className={`bg-white rounded-lg border border-gray-200 shadow-sm p-4 ${className}`}>{children}</div>;
}

function SectionTitle({ children }) {
  return <h2 className="text-2xl font-bold text-indigo-900 mb-4 border-b border-indigo-100 pb-2">{children}</h2>;
}

function OverviewTab() {
  return (
    <div>
      <SectionTitle>Fantasy Quest LARP — Rulebook Overview</SectionTitle>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <Card>

          <p className="text-sm text-gray-700 leading-relaxed">

        </Card>
        <Card>
          <h3 className="font-bold text-lg text-indigo-800 mb-2">Character Creation</h3>
          <ul className="text-sm text-gray-700 space-y-1">
            <li>• Start with <strong>90 Character Points</strong></li>
            <li>• Choose Race, Class, and Skills</li>

            <li>• New players may re-create before their 3rd event</li>
          </ul>
        </Card>
        <Card>
          <h3 className="font-bold text-lg text-indigo-800 mb-2">Skill Points &amp; Level</h3>

                <tr className="bg-indigo-50">
                  <th className="border border-indigo-100 px-2 py-1 text-left">Level</th>
                  <th className="border border-indigo-100 px-2 py-1 text-right">SP Total</th>
                  <th className="border border-indigo-100 px-2 py-1 text-left">Level</th>
                  <th className="border border-indigo-100 px-2 py-1 text-right">SP Total</th>

              <tbody>

function SkillsTab() {
  const [category, setCategory] = useState("fighting");
  const [search, setSearch] = useState("");
  const currentCat = SKILL_CATEGORIES.find((c) => c.id === category);
  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    if (!q) return currentCat.data;
    return currentCat.data.filter(
      (s) =>
        s.name.toLowerCase().includes(q) ||
        s.description.toLowerCase().includes(q) ||
        s.prereq.toLowerCase().includes(q)
    );
  }, [category, search, currentCat]);

  return (
    <div>
      <SectionTitle>Skills</SectionTitle>
      <div className="flex flex-wrap gap-2 mb-3">
        {SKILL_CATEGORIES.map((cat) => (
          <button
            key={cat.id}
            onClick={() => { setCategory(cat.id); setSearch(""); }}
            className={`px-3 py-1 rounded-full text-sm font-medium border transition-all ${category === cat.id ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-gray-700 border-gray-300 hover:border-indigo-400"}`}
          >
            {cat.label} ({cat.data.length})
          </button>
        ))}
      </div>
      <input
        type="text"
        placeholder={`Search ${currentCat.label} skills…`}
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:border-indigo-400"
      />
      <div className="space-y-2">
        {filtered.length === 0 && (
          <p className="text-gray-500 text-sm py-6 text-center">No skills match your search.</p>
        )}
        {filtered.map((skill) => (
          <Card key={skill.name} className="border-l-4 border-indigo-300">
            <div className="flex flex-wrap items-center gap-2 mb-1">
              <span className="font-bold text-indigo-900 text-sm">{skill.name}</span>
              <Badge text={skill.codes} color="indigo" />

                <Badge text={`Prereq: ${skill.prereq}`} color="yellow" />

            </div>
            <p className="text-sm text-gray-700 leading-relaxed">{skill.description}</p>
          </Card>
        ))}
      </div>
    </div>
  );
}
