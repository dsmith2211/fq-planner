<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FQ Rulebook — Browse Extracted Content</title>
  <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f14; --surface: #1a1a28; --surface2: #14142a;
      --gold: #c9a84c; --accent: #BADA55; --rust: #AA3D1D;
      --text: #e8e8f0; --muted: #8888aa; --border: #2a2a4a; --radius: 8px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Libre Baskerville', serif; line-height: 1.6; }
    h1,h2,h3 { font-family: 'Calistoga', cursive; }
    header { background: var(--surface2); border-bottom: 2px solid var(--gold); padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    header h1 { font-size: 1.4rem; color: var(--gold); }
    header .subtitle { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    .nav-links { display: flex; gap: 0.75rem; }
    .nav-link { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; text-decoration: none; font-family: 'Libre Baskerville', serif; transition: all 0.15s; }
    .nav-link:hover, .nav-link.active { border-color: var(--gold); color: var(--gold); }
    .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.9rem 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .toolbar input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 0.88rem; padding: 0.45rem 1rem; width: 300px; outline: none; font-family: inherit; }
    .toolbar input:focus { border-color: var(--gold); }
    .toolbar .stats { margin-left: auto; color: var(--muted); font-size: 0.78rem; }
    main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
    .doc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
    .doc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.2rem 1.5rem; flex-wrap: wrap; }
    .doc-title { font-size: 1.1rem; color: var(--gold); margin-bottom: 0.3rem; font-family: 'Calistoga', cursive; }
    .doc-stats { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .stat { font-size: 0.72rem; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 12px; border: 1px solid var(--border); }
    .pdf-btn { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--rust); color: #fff; padding: 0.4rem 1rem; border-radius: var(--radius); font-size: 0.78rem; font-weight: 600; text-decoration: none; white-space: nowrap; font-family: 'Libre Baskerville', serif; }
    .pdf-btn:hover { opacity: 0.85; }
    .pages-wrap { border-top: 1px solid var(--border); }
    .pages-toggle { width: 100%; background: none; border: none; color: var(--muted); font-size: 0.8rem; padding: 0.65rem 1.5rem; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 0.5rem; font-family: inherit; }
    .pages-toggle::before { content: '▶'; font-size: 0.65em; transition: transform 0.2s; }
    .pages-toggle.open::before { transform: rotate(90deg); }
    .pages-toggle:hover { color: var(--text); }
    .pages-container { display: none; padding: 0 1.5rem 1.5rem; }
    .pages-container.open { display: block; }
    .page-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-top: 0.6rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0.9rem; cursor: pointer; }
    .page-num { font-size: 0.75rem; color: var(--muted); }
    .page-toggle-btn { background: none; border: none; color: var(--muted); font-size: 0.65em; cursor: pointer; padding: 0; line-height: 1; }
    .page-toggle-btn.open { transform: rotate(90deg); display: inline-block; }
    .page-body { display: none; padding: 0.6rem 0.9rem 0.9rem; font-size: 0.8rem; color: #ccc; line-height: 1.75; border-top: 1px solid var(--border); }
    .page-body.open { display: block; }
    .page-body p { margin-bottom: 0.4rem; }
    .page-body mark { background: rgba(201,168,76,0.25); color: var(--gold); border-radius: 2px; padding: 0 2px; }
    .badge { background: var(--rust); color: #fff; font-size: 0.62rem; padding: 1px 6px; border-radius: 10px; font-weight: 600; margin-left: 4px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.75rem; margin: 0.5rem 0; overflow-x: auto; display: block; }
    th { background: var(--surface2); color: var(--gold); padding: 5px 8px; text-align: left; border: 1px solid var(--border); }
    td { padding: 4px 8px; border: 1px solid var(--border); }
    tr:nth-child(even) td { background: #ffffff08; }
    .loading { text-align: center; padding: 4rem; color: var(--muted); }
    .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.74rem; border-top: 1px solid var(--border); margin-top: 2rem; }
    .expand-all-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 3px 12px; border-radius: 4px; font-size: 0.74rem; cursor: pointer; font-family: inherit; }
    .expand-all-btn:hover { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>
<header>
  <div>
    <h1>⚔️ FQ Rulebook — Browse</h1>
    <div class="subtitle" id="hdr-stats">Loading…</div>
  </div>
  <nav class="nav-links">
    <a class="nav-link" href="index.html">Character Planner</a>
    <a class="nav-link" href="rulebook.html">Rulebook Viewer</a>
    <a class="nav-link active" href="browse.html">Browse</a>
    <a class="nav-link" href="search.html">Search</a>
  </nav>
</header>
<div class="toolbar">
  <input type="search" id="search-input" placeholder="Filter documents or page content…" autocomplete="off">
  <button class="expand-all-btn" id="expand-all-btn">Expand All</button>
  <div class="stats" id="result-count"></div>
</div>
<main id="doc-list">
  <div class="loading"><span class="spinner"></span> Loading extracted content…</div>
</main>
<footer>
  Source: <a href="https://www.fantasyquestlarp.com/rulebook" target="_blank" style="color:var(--gold)">fantasyquestlarp.com/rulebook</a>
  &nbsp;·&nbsp; Fantasy Quest Rule Book Edition 6.1 — 2018
</footer>
<script>
const PDF_FILES = [
  { stem: 'rulebook_main',    label: 'Rule Book Main (Ed. 6.1)' },
  { stem: 'clarifications',  label: 'Clarifications (rev. 4-17-19)' },
  { stem: 'wildcard_points', label: 'Wild Card Point System' },
  { stem: 'beta_rules',      label: 'Beta Test Rules 2019' },
];
const BASE = 'data/extracted/';
const PDF_BASE = 'data/pdfs/';

let allDocs = [];
let expandedAll = false;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPageText(text) {
  if (!text || !text.trim()) return '<em style="color:var(--muted)">No text on this page</em>';
  // Split on any double-newline OR newline-space-newline patterns
  const paras = text.split(/\n[\s]*\n+/).filter(p => p.trim());
  if (!paras.length) return '<em style="color:var(--muted)">No text on this page</em>';
  return paras.map(p => {
    const clean = esc(p.replace(/\n/g,' ').replace(/\s{2,}/g,' ').trim());
    return clean ? `<p>${clean}</p>` : '';
  }).filter(Boolean).join('\n');
}

function renderTable(tbl) {
  const headers = tbl.headers || [];
  if (!headers.length) return '';
  const th = headers.map(h => `<th>${esc(h)}</th>`).join('');
  const rows = (tbl.rows || []).map(row =>
    `<tr>${headers.map(h => `<td>${esc(row[h]||'')}</td>`).join('')}</tr>`
  ).join('');
  return `<div style="overflow-x:auto"><table><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function buildDocCard(doc, idx) {
  const title = esc(doc.title || doc.source_pdf);
  const pdfUrl = PDF_BASE + doc.source_pdf;
  const pageCount = doc.page_count || 0;
  const charCount = (doc.char_count || 0).toLocaleString();
  const extracted = (doc.extracted_at || '').slice(0,10);

  const pageItems = (doc.pages || []).map(page => {
    const pn = page.page;
    const hasTables = (page.tables || []).length > 0;
    const textHtml = renderPageText(page.text || '');
    const tableHtml = (page.tables || []).map(renderTable).join('');
    const bodyHtml = textHtml + tableHtml;
    const isBlank = !page.text?.trim() && !hasTables;
    return `<div class="page-item" data-text="${esc((page.text||'').toLowerCase())}">
  <div class="page-header" onclick="togglePage(this)">
    <span class="page-num">Page ${pn}${hasTables ? '<span class="badge">table</span>' : ''}</span>
    <span class="page-toggle-btn">▶</span>
  </div>
  <div class="page-body">${isBlank ? '<em style="color:var(--muted)">No text on this page</em>' : bodyHtml}</div>
</div>`;
  }).join('');

  return `<div class="doc-card" id="doc-${idx}" data-title="${title.toLowerCase()}" data-pdf="${doc.source_pdf.toLowerCase()}">
  <div class="doc-header">
    <div>
      <div class="doc-title">${title}</div>
      <div class="doc-stats">
        <span class="stat">${pageCount} pages</span>
        <span class="stat">${charCount} chars</span>
        <span class="stat">extracted ${extracted}</span>
      </div>
    </div>
    <a class="pdf-btn" href="${pdfUrl}" target="_blank">📄 Open PDF</a>
  </div>
  <div class="pages-wrap">
    <button class="pages-toggle" onclick="toggleDoc(this)">Show ${pageCount} extracted pages</button>
    <div class="pages-container">${pageItems}</div>
  </div>
</div>`;
}

function toggleDoc(btn) {
  btn.classList.toggle('open');
  const container = btn.nextElementSibling;
  container.classList.toggle('open');
  const open = container.classList.contains('open');
  btn.textContent = (open ? 'Hide' : 'Show') + ` ${btn.closest('.doc-card').querySelectorAll('.page-item').length} extracted pages`;
  if (open) btn.classList.add('open'); else btn.classList.remove('open');
}

function togglePage(header) {
  const btn = header.querySelector('.page-toggle-btn');
  const body = header.nextElementSibling;
  const open = !body.classList.contains('open');
  body.classList.toggle('open', open);
  btn.classList.toggle('open', open);
}

function filterDocs(q) {
  const cards = document.querySelectorAll('.doc-card');
  let visible = 0;
  cards.forEach(card => {
    if (!q) { card.style.display = ''; visible++; return; }
    const titleMatch = card.dataset.title.includes(q) || card.dataset.pdf.includes(q);
    // Also check page text
    const pageItems = card.querySelectorAll('.page-item');
    let anyPageMatch = false;
    pageItems.forEach(item => {
      const match = item.dataset.text.includes(q);
      item.style.display = match ? '' : 'none';
      if (match) anyPageMatch = true;
    });
    const show = titleMatch || anyPageMatch;
    card.style.display = show ? '' : 'none';
    if (show) {
      visible++;
      // Auto-expand if page content matched
      if (anyPageMatch && !titleMatch) {
        const container = card.querySelector('.pages-container');
        const btn = card.querySelector('.pages-toggle');
        if (!container.classList.contains('open')) { container.classList.add('open'); btn.classList.add('open'); }
      }
    }
  });
  document.getElementById('result-count').textContent = `${visible} doc${visible!==1?'s':''}`;
}

document.getElementById('search-input').addEventListener('input', e => {
  filterDocs(e.target.value.toLowerCase().trim());
});

document.getElementById('expand-all-btn').addEventListener('click', () => {
  expandedAll = !expandedAll;
  document.querySelectorAll('.pages-container').forEach(c => c.classList.toggle('open', expandedAll));
  document.querySelectorAll('.pages-toggle').forEach(b => b.classList.toggle('open', expandedAll));
  document.getElementById('expand-all-btn').textContent = expandedAll ? 'Collapse All' : 'Expand All';
});

async function loadAll() {
  const list = document.getElementById('doc-list');
  const docs = [];
  for (const f of PDF_FILES) {
    try {
      const r = await fetch(BASE + f.stem + '.json');
      if (!r.ok) continue;
      const data = await r.json();
      docs.push(data);
    } catch(e) { console.warn('Failed to load', f.stem, e); }
  }
  allDocs = docs;
  const totalPages = docs.reduce((a,d) => a + (d.page_count||0), 0);
  const totalChars = docs.reduce((a,d) => a + (d.char_count||0), 0);
  document.getElementById('hdr-stats').textContent =
    `${docs.length} documents · ${totalPages} pages · ${totalChars.toLocaleString()} characters`;
  document.getElementById('result-count').textContent = `${docs.length} docs`;
  list.innerHTML = docs.map((d,i) => buildDocCard(d,i)).join('');
}

loadAll();
</script>
</body>
</html>
